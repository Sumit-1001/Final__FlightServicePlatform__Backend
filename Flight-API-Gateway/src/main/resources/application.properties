spring.application.name=Flight-API-Gateway

server.port=9090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/






# FOR SCHEDULE SERVICE 
spring.cloud.gateway.server.webflux.routes[1].id=schedule-admin
spring.cloud.gateway.server.webflux.routes[1].uri=lb://FlightSchduleService
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/admin2/schedules/**

spring.cloud.gateway.server.webflux.routes[2].id=schedule-public
spring.cloud.gateway.server.webflux.routes[2].uri=lb://FlightSchduleService
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/public/schedules/**





# FOR USER SERVICE
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://FlightUserService
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/public/**




#  BOOKING SERVICE
spring.cloud.gateway.server.webflux.routes[3].id=booking-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://BookingService
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/bookings/**


#  ADMIN SERVICE
spring.cloud.gateway.server.webflux.routes[4].id=admin-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AdminServices-1
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/flights/**